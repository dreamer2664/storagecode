name: state

# The watchtower's compiler. Every 20 minutes (plus manual dispatch):
#   clone the empire (public, anonymously — NO secrets anywhere), run
#   tools/build_state.py (CONTRACT.md §2, schema v1), commit app/state.json.
# The app reads exactly one file:
#   https://raw.githubusercontent.com/dreamer2664/storagecode/main/app/state.json
#
# Why every run commits: generated_ts and the minute-tick fields (silent_min,
# age_h, count_24h) change each run by design — the freshness dot in the app
# IS the product. ~72 small commits/day on a bot-owned path; if a future
# manager wants to thin the history, lower the cron to */30 — do not remove
# the freshness.
#
# The commit is marked [skip ci] exactly like wire-archive's, so the recorder
# stays quiet (this is housekeeping, not an event) — same convention, same file.

on:
  schedule:
    # Off the hour on purpose: GitHub documents that ticks at :00 land in the
    # start-of-hour load window and can be delayed or skipped outright
    # (observed live: the 09:00Z tick never fired). :07/:27/:47 spreads us clear.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-publish
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the empire (public repos, no token)
        run: |
          set -eu
          mkdir -p src
          for r in chatcode superocr storage vigil; do
            git clone --depth 1 --quiet "https://github.com/dreamer2664/$r" "src/$r" \
              && echo "cloned $r" || echo "WARN: clone $r failed — compiler will degrade gracefully"
          done
      - name: Compile state.json
        run: |
          set -eu
          mkdir -p app
          python3 tools/build_state.py --out app/state.json --src-root src
          python3 - <<'PY'
          import json
          s = json.load(open("app/state.json"))
          assert s["schema"] == 1, "schema drift"
          print("state ok:", s["generated_ts"],
                "| cards:", sum(s["board"]["counts"].values()),
                "| warnings:", len(s["warnings"]))
          PY
      - name: Commit when it changed
        run: |
          set -eu
          if git diff --quiet -- app/state.json && [ -z "$(git status --porcelain -- app/state.json)" ]; then
            echo "state: unchanged and tracked-clean (impossible under a moving clock, but harmless)"; exit 0
          fi
          git config user.name  "storagecode-bot"
          git config user.email "storagecode-bot@users.noreply.github.com"
          git add app/state.json
          git commit -m "state: refresh [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --quiet origin main || true
            if git push --quiet origin HEAD:main; then echo "state: pushed"; exit 0; fi
            echo "push retry $i"; sleep 5
          done
          echo "state: push failed after retries"; exit 1

name: conflicts

on:
  push:
  pull_request:

jobs:
  scan-conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: no committed conflict markers
        run: python3 tools/scan_conflicts.py
      - name: scanner self-tests
        run: python3 tests/test_scan_conflicts.py

name: ledger-lint

on:
  push:
  pull_request:

jobs:
  check-pushes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: lint the ledger
        run: python3 tools/check_pushes.py
      - name: linter self-tests
        run: python3 tests/test_check_pushes.py
